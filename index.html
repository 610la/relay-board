<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>传话板</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 16px 40px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c7c7cc; flex: none; }
  .dot.on { background: #34c759; }
  .dot.off { background: #ff3b30; }
  .status { font-size: 12px; color: #86868b; }
  .sub { font-size: 13px; color: #86868b; margin: 6px 0 16px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    font-size: 16px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
    min-height: 120px;
  }
  .card.empty { color: #aeaeb2; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 15px; font-size: 17px; font-weight: 600;
    color: #fff; background: #0071e3; border: none; border-radius: 14px;
    cursor: pointer;
  }
  .btn:active { background: #0060c9; }
  .btn.ghost { background: #e8e8ed; color: #1d1d1f; flex: 0 0 auto; padding: 15px 22px; }
  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>传话板</h1>
    <span class="dot" id="dot"></span>
    <span class="status" id="status">连接中…</span>
  </div>
  <div class="sub" id="meta"></div>
  <div class="card empty" id="card">还没有内容，让 hanhan 传一句话过来。</div>
  <div class="row">
    <button class="btn" id="copyBtn" style="display:none">复制</button>
    <button class="btn ghost" id="refreshBtn">刷新</button>
  </div>
</div>
<div class="toast" id="toast">已复制</div>
<script>
(function () {
  var RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://nostr-pub.wellorder.net'];
  var PUBKEY = 'd17a2dc9f06cb14680c0157a736a9e092869af00893580edb5a7654edc8c948d';
  var TAG = 'relay-board-k7q3x9';
  var GH_API = 'https://api.github.com/repos/610la/relay-board/contents/message.json?ref=master';

  var card = document.getElementById('card');
  var copyBtn = document.getElementById('copyBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var toast = document.getElementById('toast');
  var meta = document.getElementById('meta');
  var dot = document.getElementById('dot');
  var status = document.getElementById('status');

  var text = '';
  var lastTs = 0;
  var openRelays = 0;

  function setStatus(cls, msg) {
    dot.className = 'dot ' + cls;
    status.textContent = msg;
  }

  function show(t, time, ts, via) {
    if (!(ts > lastTs)) return; // 只接受比当前更新的消息，防止旧消息顶掉新消息
    lastTs = ts;
    text = t;
    card.textContent = t;
    card.classList.remove('empty');
    copyBtn.style.display = 'block';
    meta.textContent = '消息时间 ' + time + ' · 共 ' + t.length + ' 字' + (via ? ' · ' + via : '');
    setStatus('on', '已同步');
    showToast('收到新消息');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  function b64DecodeUnicode(s) {
    s = s.replace(/\s/g, '');
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function handleContent(content, created_at) {
    try {
      var obj = JSON.parse(content);
      if (obj && obj.text) show(obj.text, obj.time || '', created_at || 0, '实时');
    } catch (e) {}
  }

  function timeStrToTs(s) {
    try { return Math.floor(new Date(s.replace(' ', 'T')).getTime() / 1000) || 0; }
    catch (e) { return 0; }
  }

  function markRelay(open) {
    openRelays += open ? 1 : -1;
    if (openRelays < 0) openRelays = 0;
    if (openRelays > 0) setStatus('on', '实时连接中');
    else setStatus('', '连接中…');
  }

  // ---- Nostr 实时订阅 ----
  var subSeq = 0;
  var liveSocks = [];
  function sendReq(ws) {
    if (!ws || ws.readyState !== 1) return;
    subSeq++;
    try {
      ws.send(JSON.stringify(['REQ', 'rs' + subSeq,
        { kinds: [1], authors: [PUBKEY], '#t': [TAG], limit: 3 }]));
    } catch (e) {}
  }
  function connectRelay(url) {
    var ws;
    try { ws = new WebSocket(url); } catch (e) { schedule(); return; }
    var opened = false;
    function schedule() { setTimeout(function () { connectRelay(url); }, 4000); }
    ws.onopen = function () {
      opened = true;
      markRelay(true);
      if (liveSocks.indexOf(ws) < 0) liveSocks.push(ws);
      sendReq(ws);
    };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m[0] === 'EVENT' && m[2]) handleContent(m[2].content, m[2].created_at);
    };
    ws.onclose = function () {
      if (opened) markRelay(false);
      var i = liveSocks.indexOf(ws);
      if (i >= 0) liveSocks.splice(i, 1);
      schedule();
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  RELAYS.forEach(connectRelay);
  // 每 5 秒在每条活连接上重新订阅一次，用历史记录兜底直播推送
  setInterval(function () {
    for (var i = 0; i < liveSocks.length; i++) sendReq(liveSocks[i]);
  }, 5000);

  // ---- GitHub 备用同步（中继全断时兜底） ----
  var syncing = false;
  function syncBackup(manual) {
    if (syncing) return;
    syncing = true;
    fetch(GH_API + '&_=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('err ' + r.status);
        return r.json();
      })
      .then(function (data) {
        syncing = false;
        if (!data || !data.content) return;
        var obj = JSON.parse(b64DecodeUnicode(data.content));
        if (obj && obj.text) {
          var ts = timeStrToTs(obj.time || '');
          if (ts > lastTs) show(obj.text, obj.time || '', ts, '备用');
          else if (manual) showToast('已经是最新');
        }
      })
      .catch(function () { syncing = false; if (manual) showToast('备用同步失败'); });
  }

  // 兼容旧的 hash 链接
  try {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var s = h.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      var t0 = b64DecodeUnicode(s);
      try { handleContent(t0, Math.floor(Date.now() / 1000)); }
      catch (e0) { show(t0, '', Math.floor(Date.now() / 1000), '链接'); }
    }
  } catch (e1) {}

  copyBtn.addEventListener('click', function () {
    function done(ok) { showToast(ok ? '已复制，去粘贴吧' : '复制失败，长按文字手动复制'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  });

  refreshBtn.addEventListener('click', function () { syncBackup(true); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) syncBackup(false);
  });

  syncBackup(false);
  setInterval(function () { syncBackup(false); }, 70000);
})();
</script>
</body>
</html>
