<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>传话板</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 16px 40px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c7c7cc; flex: none; }
  .dot.on { background: #34c759; }
  .dot.off { background: #ff3b30; }
  .status { font-size: 12px; color: #86868b; }
  .sub { font-size: 13px; color: #86868b; margin: 6px 0 16px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    font-size: 16px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
    min-height: 120px;
  }
  .card.empty { color: #aeaeb2; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 15px; font-size: 17px; font-weight: 600;
    color: #fff; background: #0071e3; border: none; border-radius: 14px;
    cursor: pointer;
  }
  .btn:active { background: #0060c9; }
  .btn.ghost { background: #e8e8ed; color: #1d1d1f; flex: 0 0 auto; padding: 15px 22px; }
  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>传话板</h1>
    <span class="dot" id="dot"></span>
    <span class="status" id="status">同步中…</span>
  </div>
  <div class="sub" id="meta"></div>
  <div class="card empty" id="card">还没有内容，让 hanhan 传一句话过来。</div>
  <div class="row">
    <button class="btn" id="copyBtn" style="display:none">复制</button>
    <button class="btn ghost" id="refreshBtn">刷新</button>
  </div>
</div>
<div class="toast" id="toast">已复制</div>
<script>
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/610la/relay-board@master/message.json';
  var card = document.getElementById('card');
  var copyBtn = document.getElementById('copyBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var toast = document.getElementById('toast');
  var meta = document.getElementById('meta');
  var dot = document.getElementById('dot');
  var status = document.getElementById('status');
  var text = '';
  var lastKey = '';

  function setStatus(cls, msg) {
    dot.className = 'dot ' + cls;
    status.textContent = msg;
  }

  function show(t, time) {
    text = t;
    card.textContent = t;
    card.classList.remove('empty');
    copyBtn.style.display = 'block';
    meta.textContent = '消息时间 ' + time + ' · 共 ' + t.length + ' 字';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  function b64DecodeUnicode(s) {
    s = s.replace(/\s/g, '');
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var syncing = false;
  function sync(manual) {
    if (syncing) return;
    syncing = true;
    if (manual) setStatus('', '同步中…');
    fetch(CDN + '?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('同步失败(' + r.status + ')');
        return r.json();
      })
      .then(function (obj) {
        syncing = false;
        if (!obj || !obj.text) return;
        var key = (obj.time || '') + '|' + obj.text;
        if (key === lastKey) {
          setStatus('on', '已是最新');
          return;
        }
        lastKey = key;
        show(obj.text, obj.time || '');
        setStatus('on', '已同步');
        showToast('收到新消息');
      })
      .catch(function (e) {
        syncing = false;
        setStatus('off', e.message || '同步失败');
      });
  }

  // 兼容旧的 hash 链接
  try {
    var h = location.hash.replace(/^#/, '');
    if (h) {
      var s = h.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      show(b64DecodeUnicode(s), '');
    }
  } catch (e) {}

  copyBtn.addEventListener('click', function () {
    function done(ok) { showToast(ok ? '已复制，去粘贴吧' : '复制失败，长按文字手动复制'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  });

  refreshBtn.addEventListener('click', function () { sync(true); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) sync(false);
  });

  sync(false);
  setInterval(function () { sync(false); }, 3000);
})();
</script>
</body>
</html>
